<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コーラル学童クラブ QR受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 5px 0;
    }

    .subtitle {
      text-align: center;
      font-size: 20px;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .mainButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #arrivalBtn {
      background: #22c55e;
      color: white;
    }

    #departureBtn {
      background: #dbeafe;
      color: #1e40af;
    }

    #arrivalBtn.off {
      background: #dcfce7;
      color: #166534;
    }

    #departureBtn.on {
      background: #2563eb;
      color: white;
    }

    #modeText {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 16px 0;
    }

    .cameraBox {
      background: white;
      padding: 14px;
      border-radius: 18px;
    }

    #reader {
      width: 100%;
    }

    .staffBtn {
      width: 100%;
      margin-top: 20px;
      background: #374151;
      color: white;
    }

    .backBtn {
      width: 100%;
      margin-bottom: 15px;
      background: #e5e7eb;
      color: #111827;
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin: 12px 0 20px;
    }

    .choiceGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choiceBtn {
      background: white;
      border: 2px solid #d1d5db;
      color: #111827;
    }

    .studentGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .studentBtn {
      background: white;
      border: 2px solid #93c5fd;
      color: #1e3a8a;
    }

    .detailCard {
      background: white;
      border-radius: 18px;
      padding: 18px;
    }

    .studentName {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .switchGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .switchBtn {
      background: #e5e7eb;
      color: #374151;
    }

    .switchBtn.selected {
      background: #2563eb;
      color: white;
    }

    .navGrid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }

    .navBtn {
      background: #e5e7eb;
      font-size: 16px;
      padding: 12px 6px;
    }

    .periodTitle {
      font-size: 23px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
    }

    .summaryGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .summaryBox {
      text-align: center;
      background: #f3f4f6;
      border-radius: 14px;
      padding: 16px 5px;
    }

    .summaryNumber {
      font-size: 32px;
      font-weight: bold;
    }

    .summaryLabel {
      font-size: 15px;
      margin-top: 4px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .calHead {
      font-weight: bold;
      text-align: center;
      padding: 6px 0;
    }

    .calDay {
      min-height: 58px;
      border-radius: 8px;
      background: #f9fafb;
      text-align: center;
      padding: 5px 2px;
    }

    .present {
      background: #dcfce7;
    }

    .absent {
      background: #fee2e2;
    }

    .future {
      background: #f3f4f6;
      color: #aaa;
    }

    .mark {
      font-size: 19px;
      font-weight: bold;
      margin-top: 4px;
    }

    .yearGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .monthCard {
      border: 2px solid #dbeafe;
      border-radius: 14px;
      padding: 14px 6px;
      text-align: center;
      background: #f8fbff;
      cursor: pointer;
    }

    .monthName {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .monthData {
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      padding: 25px 5px;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    #resultBox {
      display: none;
      text-align: center;
      margin-top: 16px;
      padding: 20px;
      border-radius: 15px;
    }

    #resultBox.success {
      background: #dcfce7;
      border: 3px solid #22c55e;
    }

    #resultBox.error {
      background: #fee2e2;
      border: 3px solid #ef4444;
    }

    #mainMessage {
      font-size: 25px;
      font-weight: bold;
    }

    #subMessage {
      margin-top: 7px;
      font-size: 18px;
    }

    .note {
      text-align: center;
      margin-top: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- QR受付 -->
  <div id="qrPage" class="page active">

    <h1>コーラル学童クラブ</h1>
    <div class="subtitle">QR 登園・下校受付</div>

    <div class="mainButtons">
      <button id="arrivalBtn" onclick="setMode('arrival')">登園</button>
      <button id="departureBtn" onclick="setMode('departure')">下校</button>
    </div>

    <div id="modeText">現在：登園モード</div>

    <div class="cameraBox">
      <div id="reader"></div>
    </div>

    <div id="resultBox">
      <div id="mainMessage"></div>
      <div id="subMessage"></div>
    </div>

    <div class="note">
      QRコードをカメラにかざしてください
    </div>

    <button class="staffBtn" onclick="openStaffMenu()">
      職員メニュー
    </button>

  </div>


  <!-- 学校 -->
  <div id="schoolPage" class="page">

    <button class="backBtn" onclick="showPage('qrPage')">
      ← QR受付に戻る
    </button>

    <div class="title">学校を選んでください</div>

    <div class="choiceGrid">

      <button class="choiceBtn" onclick="selectSchool('読谷小学校')">
        読谷小学校
      </button>

      <button class="choiceBtn" onclick="selectSchool('喜名小学校')">
        喜名小学校
      </button>

    </div>

  </div>


  <!-- 学年 -->
  <div id="gradePage" class="page">

    <button class="backBtn" onclick="showPage('schoolPage')">
      ← 学校選択に戻る
    </button>

    <div id="schoolTitle" class="title"></div>

    <div class="choiceGrid">
      <button class="choiceBtn" onclick="selectGrade(1)">1年生</button>
      <button class="choiceBtn" onclick="selectGrade(2)">2年生</button>
      <button class="choiceBtn" onclick="selectGrade(3)">3年生</button>
      <button class="choiceBtn" onclick="selectGrade(4)">4年生</button>
      <button class="choiceBtn" onclick="selectGrade(5)">5年生</button>
      <button class="choiceBtn" onclick="selectGrade(6)">6年生</button>
    </div>

  </div>


  <!-- 児童一覧 -->
  <div id="studentPage" class="page">

    <button class="backBtn" onclick="showPage('gradePage')">
      ← 学年選択に戻る
    </button>

    <div id="studentTitle" class="title"></div>

    <div id="studentList" class="studentGrid"></div>
    <div id="studentLoading" class="loading"></div>

  </div>


  <!-- 詳細 -->
  <div id="detailPage" class="page">

    <button class="backBtn" onclick="showPage('studentPage')">
      ← 児童一覧に戻る
    </button>

    <div class="detailCard">

      <div id="detailName" class="studentName"></div>

      <div class="switchGrid">

        <button
          id="monthBtn"
          class="switchBtn selected"
          onclick="showMonthView()"
        >
          月間
        </button>

        <button
          id="yearBtn"
          class="switchBtn"
          onclick="showYearView()"
        >
          年間
        </button>

      </div>


      <!-- 月間 -->
      <div id="monthView">

        <div class="navGrid">

          <button class="navBtn" onclick="changeMonth(-1)">
            〈 前月
          </button>

          <div id="monthTitle" class="periodTitle">
            2026年9月
          </div>

          <button class="navBtn" onclick="changeMonth(1)">
            翌月 〉
          </button>

        </div>

        <div class="summaryGrid">

          <div class="summaryBox">
            <div id="monthUse" class="summaryNumber">0</div>
            <div class="summaryLabel">利用日数</div>
          </div>

          <div class="summaryBox">
            <div id="monthAbsent" class="summaryNumber">0</div>
            <div class="summaryLabel">欠席日数</div>
          </div>

        </div>

        <div id="calendar" class="calendar"></div>

      </div>


      <!-- 年間 -->
      <div id="yearView" class="hidden">

        <div class="navGrid">

          <button class="navBtn" onclick="changeYear(-1)">
            〈 前年
          </button>

          <div id="yearTitle" class="periodTitle">
            2026年
          </div>

          <button class="navBtn" onclick="changeYear(1)">
            翌年 〉
          </button>

        </div>

        <div class="summaryGrid">

          <div class="summaryBox">
            <div id="yearUse" class="summaryNumber">0</div>
            <div class="summaryLabel">年間利用日数</div>
          </div>

          <div class="summaryBox">
            <div id="yearAbsent" class="summaryNumber">0</div>
            <div class="summaryLabel">年間欠席日数</div>
          </div>

        </div>

        <div id="yearGrid" class="yearGrid"></div>

      </div>

    </div>

  </div>

</div>


<script>

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbw4h90m1o43II_d-JCrGjTucM6bOL5u_JCW5jEltHzm5tozR1zKPnPpov-OaHFZvwRz-g/exec';

let mode = 'arrival';
let processing = false;
let lastCode = '';
let lastScan = 0;

let selectedSchool = '';
let selectedGrade = '';

let selectedStudentId = '';
let selectedStudentName = '';

const now = new Date();

let selectedYear = now.getFullYear();
let selectedMonth = now.getMonth() + 1;


// ページ表示
function showPage(id) {

  document
    .querySelectorAll('.page')
    .forEach(function(page) {
      page.classList.remove('active');
    });

  document
    .getElementById(id)
    .classList.add('active');
}


// 職員メニュー
function openStaffMenu() {
  showPage('schoolPage');
}


// 学校選択
function selectSchool(school) {

  selectedSchool = school;

  document
    .getElementById('schoolTitle')
    .innerText =
      school + '：学年を選択';

  showPage('gradePage');
}


// 学年選択
function selectGrade(grade) {

  selectedGrade = grade;

  document
    .getElementById('studentTitle')
    .innerText =
      selectedSchool +
      ' ' +
      grade +
      '年生';

  showPage('studentPage');

  loadStudents();
}


// 児童一覧
function loadStudents() {

  const list =
    document.getElementById('studentList');

  const loading =
    document.getElementById('studentLoading');

  list.innerHTML = '';

  loading.innerText =
    '児童一覧を読み込んでいます...';

  jsonpRequest(
    {
      action: 'students',
      school: selectedSchool,
      grade: selectedGrade
    },
    function(result) {

      loading.innerText = '';

      if (!result || !result.success) {

        loading.innerText =
          result && result.message
            ? result.message
            : '児童一覧を取得できませんでした。';

        return;
      }

      if (!result.students || result.students.length === 0) {

        loading.innerText =
          'この学年の児童はいません。';

        return;
      }

      result.students.forEach(function(student) {

        const btn =
          document.createElement('button');

        btn.className =
          'studentBtn';

        btn.innerText =
          student.name;

        btn.onclick =
          function() {

            openStudent(
              student.id,
              student.name
            );
          };

        list.appendChild(btn);
      });
    }
  );
}


// 児童詳細
function openStudent(
  id,
  name
) {

  selectedStudentId = id;
  selectedStudentName = name;

  const d = new Date();

  selectedYear =
    d.getFullYear();

  selectedMonth =
    d.getMonth() + 1;

  document
    .getElementById('detailName')
    .innerText =
      name;

  showPage('detailPage');

  showMonthView();
}


// 月間表示
function showMonthView() {

  document
    .getElementById('monthView')
    .classList.remove('hidden');

  document
    .getElementById('yearView')
    .classList.add('hidden');

  document
    .getElementById('monthBtn')
    .classList.add('selected');

  document
    .getElementById('yearBtn')
    .classList.remove('selected');

  loadMonth();
}


// 年間表示
function showYearView() {

  document
    .getElementById('monthView')
    .classList.add('hidden');

  document
    .getElementById('yearView')
    .classList.remove('hidden');

  document
    .getElementById('monthBtn')
    .classList.remove('selected');

  document
    .getElementById('yearBtn')
    .classList.add('selected');

  loadYear();
}


// 前月・翌月
function changeMonth(change) {

  selectedMonth += change;

  if (selectedMonth < 1) {
    selectedMonth = 12;
    selectedYear--;
  }

  if (selectedMonth > 12) {
    selectedMonth = 1;
    selectedYear++;
  }

  loadMonth();
}


// 前年・翌年
function changeYear(change) {

  selectedYear += change;

  loadYear();
}


// 月間取得
function loadMonth() {

  // ★ここで必ず年月を表示
  document
    .getElementById('monthTitle')
    .innerText =
      selectedYear +
      '年' +
      selectedMonth +
      '月';

  document
    .getElementById('monthUse')
    .innerText = '-';

  document
    .getElementById('monthAbsent')
    .innerText = '-';

  document
    .getElementById('calendar')
    .innerHTML =
      '<div class="loading">読み込み中...</div>';

  jsonpRequest(
    {
      action: 'studentMonth',
      studentId: selectedStudentId,
      year: selectedYear,
      month: selectedMonth
    },
    function(result) {

      if (!result || !result.success) {

        document
          .getElementById('calendar')
          .innerHTML =
            '<div class="loading">データを取得できませんでした。</div>';

        return;
      }

      // GAS側の年月でも再設定
      document
        .getElementById('monthTitle')
        .innerText =
          result.year +
          '年' +
          result.month +
          '月';

      document
        .getElementById('monthUse')
        .innerText =
          result.useDays || 0;

      document
        .getElementById('monthAbsent')
        .innerText =
          result.absenceDays || 0;

      drawCalendar(
        result.year,
        result.month,
        result.days || []
      );
    }
  );
}


// 年間取得
function loadYear() {

  // ★ここで必ず年を表示
  document
    .getElementById('yearTitle')
    .innerText =
      selectedYear +
      '年';

  document
    .getElementById('yearUse')
    .innerText = '-';

  document
    .getElementById('yearAbsent')
    .innerText = '-';

  document
    .getElementById('yearGrid')
    .innerHTML =
      '<div class="loading">読み込み中...</div>';

  jsonpRequest(
    {
      action: 'studentYear',
      studentId: selectedStudentId,
      year: selectedYear
    },
    function(result) {

      if (!result || !result.success) {

        document
          .getElementById('yearGrid')
          .innerHTML =
            '<div class="loading">年間データを取得できませんでした。</div>';

        return;
      }

      document
        .getElementById('yearTitle')
        .innerText =
          result.year +
          '年';

      document
        .getElementById('yearUse')
        .innerText =
          result.useDays || 0;

      document
        .getElementById('yearAbsent')
        .innerText =
          result.absenceDays || 0;

      drawYear(
        result.months || []
      );
    }
  );
}


// 年間12か月
function drawYear(months) {

  const grid =
    document.getElementById('yearGrid');

  grid.innerHTML = '';

  months.forEach(function(item) {

    const card =
      document.createElement('div');

    card.className =
      'monthCard';

    card.innerHTML =
      '<div class="monthName">' +
      item.month +
      '月</div>' +
      '<div class="monthData">' +
      '利用：' +
      item.useDays +
      '日<br>' +
      '欠席：' +
      item.absenceDays +
      '日</div>';

    card.onclick =
      function() {

        selectedMonth =
          item.month;

        showMonthView();
      };

    grid.appendChild(card);
  });
}


// カレンダー
function drawCalendar(
  year,
  month,
  days
) {

  const calendar =
    document.getElementById('calendar');

  calendar.innerHTML = '';

  ['日','月','火','水','木','金','土']
    .forEach(function(name) {

      const head =
        document.createElement('div');

      head.className =
        'calHead';

      head.innerText =
        name;

      calendar.appendChild(head);
    });


  const first =
    new Date(
      year,
      month - 1,
      1
    ).getDay();


  for (
    let i = 0;
    i < first;
    i++
  ) {

    calendar.appendChild(
      document.createElement('div')
    );
  }


  days.forEach(function(item) {

    const box =
      document.createElement('div');

    box.className =
      'calDay';

    if (item.status === 'present') {
      box.classList.add('present');
    }

    if (item.status === 'absent') {
      box.classList.add('absent');
    }

    if (item.status === 'future') {
      box.classList.add('future');
    }

    let mark = '';

    if (item.status === 'present') {
      mark = '○';
    }

    if (item.status === 'absent') {
      mark = '×';
    }

    box.innerHTML =
      '<div>' +
      item.day +
      '</div>' +
      '<div class="mark">' +
      mark +
      '</div>';

    calendar.appendChild(box);
  });
}


// JSONP通信
function jsonpRequest(
  params,
  callback
) {

  const callbackName =
    'coral_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 99999
    );

  const script =
    document.createElement('script');

  let finished = false;


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {}
  }


  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }

      finished = true;

      callback(result);

      cleanup();
    };


  const query =
    Object.keys(params)
      .map(function(key) {

        return (
          encodeURIComponent(key) +
          '=' +
          encodeURIComponent(
            params[key]
          )
        );
      })
      .join('&');


  script.src =
    GAS_URL +
    '?' +
    query +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&t=' +
    Date.now();


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      callback({
        success: false,
        message:
          '通信できませんでした。'
      });

      cleanup();
    };


  document.body.appendChild(script);


  // 15秒経っても返らない時
  setTimeout(function() {

    if (finished) {
      return;
    }

    finished = true;

    callback({
      success: false,
      message:
        '通信に時間がかかっています。'
    });

    cleanup();

  }, 15000);
}


// 登園・下校
function setMode(newMode) {

  mode = newMode;

  const arrival =
    document.getElementById('arrivalBtn');

  const departure =
    document.getElementById('departureBtn');

  if (mode === 'arrival') {

    arrival.classList.remove('off');
    departure.classList.remove('on');

    document
      .getElementById('modeText')
      .innerText =
        '現在：登園モード';

  } else {

    arrival.classList.add('off');
    departure.classList.add('on');

    document
      .getElementById('modeText')
      .innerText =
        '現在：下校モード';
  }
}


// QR読取
function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  const time =
    Date.now();

  if (
    decodedText === lastCode &&
    time - lastScan < 3000
  ) {
    return;
  }

  lastCode =
    decodedText;

  lastScan =
    time;

  processing =
    true;


  jsonpRequest(
    {
      action: 'scan',
      qr: decodedText,
      mode: mode
    },
    function(result) {

      processing =
        false;

      if (
        result &&
        result.success
      ) {

        beep(880, 0.18);

        showResult(
          true,
          result.message,
          result.time || ''
        );

      } else {

        beep(300, 0.30);

        showResult(
          false,
          result && result.message
            ? result.message
            : '登録できませんでした。',
          result && result.subMessage
            ? result.subMessage
            : ''
        );
      }

      setTimeout(
        hideResult,
        3500
      );
    }
  );
}


// 結果
function showResult(
  success,
  main,
  sub
) {

  const box =
    document.getElementById('resultBox');

  box.className =
    success
      ? 'success'
      : 'error';

  box.style.display =
    'block';

  document
    .getElementById('mainMessage')
    .innerText =
      success
        ? '✓ ' + main
        : main;

  document
    .getElementById('subMessage')
    .innerText =
      sub || '';
}


function hideResult() {

  document
    .getElementById('resultBox')
    .style.display =
      'none';
}


// 音
function beep(
  frequency,
  seconds
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const context =
      new AudioContext();

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.connect(gain);
    gain.connect(context.destination);

    oscillator.frequency.value =
      frequency;

    gain.gain.value =
      0.15;

    oscillator.start();

    oscillator.stop(
      context.currentTime +
      seconds
    );

  } catch (e) {}
}


// カメラ
function startCamera() {

  const scanner =
    new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true
      },
      false
    );

  scanner.render(
    onScanSuccess,
    function() {}
  );
}


// 起動
window.addEventListener(
  'load',
  function() {

    setMode('arrival');

    startCamera();
  }
);

</script>
