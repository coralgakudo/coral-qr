<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コーラル学童 QR登園・下校</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans JP", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: white;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .sub {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    .hidden {
      display: none !important;
    }

    .modeButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .arrivalBtn {
      background: #22c55e;
      color: white;
    }

    .departureBtn {
      background: #2563eb;
      color: white;
    }

    .staffBtn {
      width: 100%;
      background: #374151;
      color: white;
      margin-top: 12px;
    }

    .backBtn {
      background: #e5e7eb;
      color: #222;
      margin-bottom: 12px;
    }

    .selected {
      outline: 4px solid #111827;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    .statusText {
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
      font-size: 18px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choiceBtn {
      background: #eef2ff;
      color: #222;
      min-height: 62px;
    }

    .childBtn {
      width: 100%;
      text-align: left;
      background: #f3f4f6;
      margin-bottom: 9px;
      padding: 15px;
      font-size: 18px;
    }

    .studentId {
      font-size: 12px;
      color: #888;
      margin-left: 7px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .summaryBox {
      padding: 12px 5px;
      border-radius: 12px;
      text-align: center;
      background: #f3f4f6;
    }

    .summaryNum {
      font-size: 25px;
      font-weight: bold;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: 5px;
      margin-top: 12px;
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 0;
    }

    .day {
      min-height: 65px;
      border-radius: 9px;
      padding: 5px;
      text-align: center;
      font-size: 13px;
      background: #f3f4f6;
    }

    .present {
      background: #dcfce7;
    }

    .absent {
      background: #fee2e2;
    }

    .closed {
      background: #e5e7eb;
      color: #666;
    }

    .future {
      background: #f8fafc;
      color: #aaa;
    }

    .mark {
      font-size: 21px;
      font-weight: bold;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    select {
      font-size: 17px;
      padding: 9px;
      border-radius: 9px;
    }

    .cancelArea {
      margin-top: 20px;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .cancelBtn {
      width: 100%;
      margin-top: 8px;
      color: white;
    }

    .cancelArrival {
      background: #dc2626;
    }

    .cancelDeparture {
      background: #f97316;
    }

    button:disabled {
      background: #ccc !important;
      color: #777 !important;
      cursor: default;
    }

    .yearMonth {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 99999;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 25px;
    }

    .overlay.success {
      background: #16a34a;
    }

    .overlay.duplicate {
      background: #dc2626;
    }

    .overlay.error {
      background: #991b1b;
    }

    .overlayIcon {
      font-size: 90px;
      font-weight: bold;
    }

    .overlayTitle {
      font-size: 37px;
      font-weight: bold;
      margin: 10px 0;
    }

    .overlayName {
      font-size: 31px;
      font-weight: bold;
    }

    .overlayInfo {
      margin-top: 12px;
      font-size: 23px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>コーラル学童クラブ</h1>
  <div class="sub">QR 登園・下校管理</div>
</header>

<div class="wrap">

  <!-- QR受付 -->
  <section id="scanPage">

    <div class="card">

      <div class="modeButtons">
        <button id="arrivalMode"
                class="arrivalBtn selected"
                onclick="setMode('arrival')">
          登 園
        </button>

        <button id="departureMode"
                class="departureBtn"
                onclick="setMode('departure')">
          下 校
        </button>
      </div>

      <div id="modeText" class="statusText">
        登園QRを読み取ってください
      </div>

      <div id="reader"></div>

      <button class="staffBtn"
              onclick="openStaffMenu()">
        職員メニュー
      </button>

    </div>

  </section>


  <!-- 職員メニュー -->
  <section id="staffPage" class="hidden">

    <div class="card">

      <button class="backBtn"
              onclick="backToScan()">
        ← QR受付に戻る
      </button>

      <h2>職員メニュー</h2>

      <div id="staffLoading" class="loading">
        児童名簿を読み込み中...
      </div>

      <div id="schoolArea" class="hidden">

        <h3>① 学校を選択</h3>

        <div class="grid2">

          <button class="choiceBtn"
                  onclick="chooseSchool('読谷小学校')">
            読谷小学校
          </button>

          <button class="choiceBtn"
                  onclick="chooseSchool('喜名小学校')">
            喜名小学校
          </button>

        </div>

      </div>


      <div id="gradeArea" class="hidden">

        <button class="backBtn"
                onclick="showSchoolArea()">
          ← 学校選択に戻る
        </button>

        <h3 id="selectedSchoolText"></h3>

        <h3>② 学年を選択</h3>

        <div class="grid3">
          <button class="choiceBtn" onclick="chooseGrade('1年')">1年</button>
          <button class="choiceBtn" onclick="chooseGrade('2年')">2年</button>
          <button class="choiceBtn" onclick="chooseGrade('3年')">3年</button>
          <button class="choiceBtn" onclick="chooseGrade('4年')">4年</button>
          <button class="choiceBtn" onclick="chooseGrade('5年')">5年</button>
          <button class="choiceBtn" onclick="chooseGrade('6年')">6年</button>
        </div>

      </div>


      <div id="childArea" class="hidden">

        <button class="backBtn"
                onclick="showGradeArea()">
          ← 学年選択に戻る
        </button>

        <h3 id="childTitle"></h3>

        <div id="childList"></div>

      </div>

    </div>

  </section>


  <!-- 児童詳細 -->
  <section id="detailPage" class="hidden">

    <div class="card">

      <button class="backBtn"
              onclick="backToChildren()">
        ← 児童一覧に戻る
      </button>

      <h2 id="detailName"></h2>

      <div id="detailStudentId"
           style="color:#777;"></div>

      <div class="controls">

        <select id="viewType"
                onchange="changeView()">
          <option value="month">月間</option>
          <option value="year">年間</option>
        </select>

        <select id="yearSelect"
                onchange="loadCurrentView()">
        </select>

        <select id="monthSelect"
                onchange="loadCurrentView()">
        </select>

      </div>

      <div id="detailLoading"
           class="loading hidden">
        読み込み中...
      </div>

      <div id="monthView"></div>

      <div id="yearView"
           class="hidden"></div>

      <div class="cancelArea">

        <h3>間違えた時の取消</h3>

        <div id="todayState"
             style="margin-bottom:10px;">
          今日の状態を確認中...
        </div>

        <button id="cancelArrivalBtn"
                class="cancelBtn cancelArrival"
                onclick="cancelArrival()">
          登園取消
        </button>

        <button id="cancelDepartureBtn"
                class="cancelBtn cancelDeparture"
                onclick="cancelDeparture()">
          下校取消
        </button>

      </div>

    </div>

  </section>

</div>


<!-- 全画面結果 -->
<div id="resultOverlay" class="overlay">

  <div>

    <div id="overlayIcon"
         class="overlayIcon"></div>

    <div id="overlayTitle"
         class="overlayTitle"></div>

    <div id="overlayName"
         class="overlayName"></div>

    <div id="overlayInfo"
         class="overlayInfo"></div>

  </div>

</div>


<script>

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbxAMeNS1z_EnTgojm2KCGrhcimRXFr0XZD-FlhVGShh-AjCj3xTpyPYLaIAhx-wUKZo9g/exec';


let scanMode = 'arrival';

let allStudents = [];

let selectedSchool = '';

let selectedGrade = '';

let selectedStudent = null;

let scanner = null;

let scanBusy = false;


/* ==============================
   QRモード
============================== */

function setMode(mode) {

  scanMode = mode;

  document
    .getElementById('arrivalMode')
    .classList.toggle(
      'selected',
      mode === 'arrival'
    );

  document
    .getElementById('departureMode')
    .classList.toggle(
      'selected',
      mode === 'departure'
    );

  document
    .getElementById('modeText')
    .innerText =
      mode === 'arrival'
        ? '登園QRを読み取ってください'
        : '下校QRを読み取ってください';
}


/* ==============================
   QRスキャナー
============================== */

function startScanner() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

  scanner.render(
    onScanSuccess,
    function() {}
  );
}


function onScanSuccess(decodedText) {

  if (scanBusy) {
    return;
  }

  scanBusy = true;

  jsonpRequest(
    {
      action: 'scan',
      qr: decodedText,
      mode: scanMode
    },

    function(result) {

      if (
        result &&
        result.success
      ) {

        playSuccessSound();

        showOverlay(
          'success',
          '✓',
          '読み取りました！',
          result.name || '',
          (result.mode || '') +
          '　' +
          (result.time || '')
        );

      } else {

        const isDuplicate =
          result &&
          result.type === 'duplicate';

        playErrorSound();

        showOverlay(
          isDuplicate
            ? 'duplicate'
            : 'error',

          isDuplicate
            ? '⚠'
            : '×',

          isDuplicate
            ? 'すでに読み取り済みです'
            : '読み取りできませんでした',

          result &&
          result.name
            ? result.name
            : '',

          result &&
          result.message
            ? result.message
            : ''
        );
      }

      setTimeout(
        function() {
          scanBusy = false;
        },
        3200
      );
    }
  );
}


/* ==============================
   全画面表示
============================== */

function showOverlay(
  type,
  icon,
  title,
  name,
  info
) {

  const overlay =
    document.getElementById(
      'resultOverlay'
    );

  overlay.className =
    'overlay ' + type;

  document
    .getElementById('overlayIcon')
    .innerText = icon;

  document
    .getElementById('overlayTitle')
    .innerText = title;

  document
    .getElementById('overlayName')
    .innerText = name || '';

  document
    .getElementById('overlayInfo')
    .innerText = info || '';

  overlay.style.display =
    'flex';

  setTimeout(
    function() {
      overlay.style.display =
        'none';
    },
    3000
  );
}


/* ==============================
   音
============================== */

function playSuccessSound() {

  try {

    const ctx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.connect(gain);
    gain.connect(
      ctx.destination
    );

    osc.frequency.value = 1000;
    gain.gain.value = 0.15;

    osc.start();

    setTimeout(
      function() {
        osc.stop();
        ctx.close();
      },
      130
    );

  } catch (e) {}
}


function playErrorSound() {

  try {

    const ctx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.connect(gain);
    gain.connect(
      ctx.destination
    );

    osc.frequency.value = 250;
    gain.gain.value = 0.18;

    osc.start();

    setTimeout(
      function() {
        osc.stop();
        ctx.close();
      },
      300
    );

  } catch (e) {}
}


/* ==============================
   職員メニュー
============================== */

function openStaffMenu() {

  document
    .getElementById('scanPage')
    .classList.add('hidden');

  document
    .getElementById('detailPage')
    .classList.add('hidden');

  document
    .getElementById('staffPage')
    .classList.remove('hidden');

  loadStudents();
}


function backToScan() {

  document
    .getElementById('staffPage')
    .classList.add('hidden');

  document
    .getElementById('detailPage')
    .classList.add('hidden');

  document
    .getElementById('scanPage')
    .classList.remove('hidden');
}


/* ==============================
   児童一覧取得
============================== */

function loadStudents() {

  const loading =
    document.getElementById(
      'staffLoading'
    );

  loading.classList.remove(
    'hidden'
  );

  document
    .getElementById('schoolArea')
    .classList.add('hidden');

  jsonpRequest(
    {
      action: 'students'
    },

    function(result) {

      loading.classList.add(
        'hidden'
      );

      if (
        !result ||
        !result.success
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : '児童名簿を取得できませんでした。'
        );

        return;
      }

      allStudents =
        result.students || [];

      document
        .getElementById('schoolArea')
        .classList.remove('hidden');
    }
  );
}


/* ==============================
   学校
============================== */

function chooseSchool(school) {

  selectedSchool = school;

  document
    .getElementById('schoolArea')
    .classList.add('hidden');

  document
    .getElementById('gradeArea')
    .classList.remove('hidden');

  document
    .getElementById('selectedSchoolText')
    .innerText =
      selectedSchool;
}


function showSchoolArea() {

  document
    .getElementById('gradeArea')
    .classList.add('hidden');

  document
    .getElementById('childArea')
    .classList.add('hidden');

  document
    .getElementById('schoolArea')
    .classList.remove('hidden');
}


/* ==============================
   学年
============================== */

function chooseGrade(grade) {

  selectedGrade = grade;

  document
    .getElementById('gradeArea')
    .classList.add('hidden');

  document
    .getElementById('childArea')
    .classList.remove('hidden');

  document
    .getElementById('childTitle')
    .innerText =
      selectedSchool +
      '　' +
      selectedGrade;

  renderChildren();
}


function showGradeArea() {

  document
    .getElementById('childArea')
    .classList.add('hidden');

  document
    .getElementById('gradeArea')
    .classList.remove('hidden');
}


/* ==============================
   児童名表示
============================== */

function renderChildren() {

  const list =
    document.getElementById(
      'childList'
    );

  list.innerHTML = '';

  const students =
    allStudents.filter(
      function(s) {

        return (
          s.school === selectedSchool &&
          normalizeGrade(s.grade) ===
          normalizeGrade(selectedGrade)
        );
      }
    );


  if (
    students.length === 0
  ) {

    list.innerHTML =
      '<div class="loading">この学年の児童がいません。</div>';

    return;
  }


  students.forEach(
    function(student) {

      const button =
        document.createElement(
          'button'
        );

      button.className =
        'childBtn';

      /*
       内部では児童IDを保持します。
       職員画面には児童名を表示します。
      */
      button.innerHTML =
        escapeHtml(
          student.name || '名前未登録'
        ) +
        '<span class="studentId">' +
        escapeHtml(
          student.studentId
        ) +
        '</span>';

      button.onclick =
        function() {
          openStudent(
            student.studentId
          );
        };

      list.appendChild(
        button
      );
    }
  );
}


function normalizeGrade(value) {

  return String(
    value || ''
  )
    .replace('年生','年')
    .trim();
}


/* ==============================
   児童詳細
============================== */

function openStudent(studentId) {

  /*
    名前ではなく児童IDで本人を特定
  */
  selectedStudent =
    allStudents.find(
      function(s) {
        return (
          s.studentId ===
          studentId
        );
      }
    );

  if (!selectedStudent) {

    alert(
      '児童が見つかりません。'
    );

    return;
  }

  document
    .getElementById('staffPage')
    .classList.add('hidden');

  document
    .getElementById('detailPage')
    .classList.remove('hidden');

  document
    .getElementById('detailName')
    .innerText =
      selectedStudent.name;

  document
    .getElementById(
      'detailStudentId'
    )
    .innerText =
      '児童ID：' +
      selectedStudent.studentId;

  setupDateSelectors();

  loadCurrentView();

  loadTodayStatus();
}


function backToChildren() {

  document
    .getElementById('detailPage')
    .classList.add('hidden');

  document
    .getElementById('staffPage')
    .classList.remove('hidden');

  document
    .getElementById('schoolArea')
    .classList.add('hidden');

  document
    .getElementById('gradeArea')
    .classList.add('hidden');

  document
    .getElementById('childArea')
    .classList.remove('hidden');

  renderChildren();
}


/* ==============================
   年月設定
============================== */

function setupDateSelectors() {

  const now =
    new Date();

  const currentYear =
    now.getFullYear();

  const currentMonth =
    now.getMonth() + 1;

  const yearSelect =
    document.getElementById(
      'yearSelect'
    );

  const monthSelect =
    document.getElementById(
      'monthSelect'
    );

  yearSelect.innerHTML = '';

  for (
    let y = currentYear - 2;
    y <= currentYear + 1;
    y++
  ) {

    const option =
      document.createElement(
        'option'
      );

    option.value = y;
    option.textContent =
      y + '年';

    if (
      y === currentYear
    ) {
      option.selected = true;
    }

    yearSelect.appendChild(
      option
    );
  }


  monthSelect.innerHTML = '';

  for (
    let m = 1;
    m <= 12;
    m++
  ) {

    const option =
      document.createElement(
        'option'
      );

    option.value = m;
    option.textContent =
      m + '月';

    if (
      m === currentMonth
    ) {
      option.selected = true;
    }

    monthSelect.appendChild(
      option
    );
  }
}


function changeView() {

  const type =
    document
      .getElementById('viewType')
      .value;

  document
    .getElementById('monthSelect')
    .style.display =
      type === 'month'
        ? ''
        : 'none';

  loadCurrentView();
}


function loadCurrentView() {

  if (!selectedStudent) {
    return;
  }

  const type =
    document
      .getElementById('viewType')
      .value;

  if (
    type === 'year'
  ) {
    loadYear();
  } else {
    loadMonth();
  }
}


/* ==============================
   月間
============================== */

function loadMonth() {

  const year =
    document
      .getElementById('yearSelect')
      .value;

  const month =
    document
      .getElementById('monthSelect')
      .value;

  showDetailLoading(true);

  jsonpRequest(
    {
      action: 'studentMonth',

      studentId:
        selectedStudent.studentId,

      year: year,

      month: month
    },

    function(result) {

      showDetailLoading(false);

      if (
        !result ||
        !result.success
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : '月間データを取得できません。'
        );

        return;
      }

      renderMonth(result);
    }
  );
}


function renderMonth(data) {

  const box =
    document.getElementById(
      'monthView'
    );

  document
    .getElementById('yearView')
    .classList.add('hidden');

  box.classList.remove(
    'hidden'
  );

  let html = '';

  html +=
    '<div class="summary">' +

    '<div class="summaryBox">' +
    '<div>登所</div>' +
    '<div class="summaryNum">' +
    data.present +
    '</div></div>' +

    '<div class="summaryBox">' +
    '<div>欠席</div>' +
    '<div class="summaryNum">' +
    data.absent +
    '</div></div>' +

    '<div class="summaryBox">' +
    '<div>休所</div>' +
    '<div class="summaryNum">' +
    data.closed +
    '</div></div>' +

    '</div>';


  html +=
    '<div class="calendar">';

  ['日','月','火','水','木','金','土']
    .forEach(
      function(w) {
        html +=
          '<div class="weekday">' +
          w +
          '</div>';
      }
    );


  const firstDay =
    new Date(
      data.year,
      data.month - 1,
      1
    ).getDay();

  for (
    let i = 0;
    i < firstDay;
    i++
  ) {
    html += '<div></div>';
  }


  data.days.forEach(
    function(day) {

      let mark = '';
      let cls =
        day.status || '';

      let extra = '';

      if (
        day.status === 'present'
      ) {
        mark = '○';

        extra =
          day.arrivalTime
            ? '<div>' +
              escapeHtml(
                day.arrivalTime
              ) +
              '</div>'
            : '';

      } else if (
        day.status === 'absent'
      ) {

        mark = '×';

      } else if (
        day.status === 'closed'
      ) {

        mark = '休';

        extra =
          day.reason
            ? '<div>' +
              escapeHtml(
                day.reason
              ) +
              '</div>'
            : '';
      }

      html +=
        '<div class="day ' +
        cls +
        '">' +

        '<div>' +
        day.day +
        '</div>' +

        '<div class="mark">' +
        mark +
        '</div>' +

        extra +

        '</div>';
    }
  );

  html += '</div>';

  box.innerHTML = html;
}


/* ==============================
   年間
============================== */

function loadYear() {

  const year =
    document
      .getElementById('yearSelect')
      .value;

  showDetailLoading(true);

  jsonpRequest(
    {
      action: 'studentYear',

      studentId:
        selectedStudent.studentId,

      year: year
    },

    function(result) {

      showDetailLoading(false);

      if (
        !result ||
        !result.success
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : '年間データを取得できません。'
        );

        return;
      }

      renderYear(result);
    }
  );
}


function renderYear(data) {

  document
    .getElementById('monthView')
    .classList.add('hidden');

  const box =
    document.getElementById(
      'yearView'
    );

  box.classList.remove(
    'hidden'
  );

  let html =
    '<div class="summary">' +

    '<div class="summaryBox">' +
    '<div>年間登所</div>' +
    '<div class="summaryNum">' +
    data.present +
    '</div></div>' +

    '<div class="summaryBox">' +
    '<div>年間欠席</div>' +
    '<div class="summaryNum">' +
    data.absent +
    '</div></div>' +

    '<div class="summaryBox">' +
    '<div>年間休所</div>' +
    '<div class="summaryNum">' +
    data.closed +
    '</div></div>' +

    '</div>';


  data.months.forEach(
    function(m) {

      html +=
        '<div class="yearMonth">' +

        '<strong>' +
        m.month +
        '月</strong><br>' +

        '登所 ' +
        m.present +
        '日　／　' +

        '欠席 ' +
        m.absent +
        '日　／　' +

        '休所 ' +
        m.closed +
        '日' +

        '</div>';
    }
  );

  box.innerHTML = html;
}


/* ==============================
   今日の状態
============================== */

function loadTodayStatus() {

  if (!selectedStudent) {
    return;
  }

  jsonpRequest(
    {
      action: 'todayStatus',

      studentId:
        selectedStudent.studentId
    },

    function(result) {

      const state =
        document.getElementById(
          'todayState'
        );

      const arrival =
        document.getElementById(
          'cancelArrivalBtn'
        );

      const departure =
        document.getElementById(
          'cancelDepartureBtn'
        );


      if (
        !result ||
        !result.success
      ) {

        state.innerText =
          '今日の状態を取得できません。';

        arrival.disabled = true;
        departure.disabled = true;

        return;
      }


      if (!result.arrived) {

        state.innerText =
          '今日：まだ登園していません';

        arrival.disabled = true;
        departure.disabled = true;

        return;
      }


      if (
        result.departed
      ) {

        state.innerText =
          '今日：登園 ' +
          (result.arrivalTime || '') +
          ' ／ 下校 ' +
          (result.departureTime || '');

        arrival.disabled = false;
        departure.disabled = false;

      } else {

        state.innerText =
          '今日：登園中　' +
          (result.arrivalTime || '');

        arrival.disabled = false;
        departure.disabled = true;
      }
    }
  );
}


/* ==============================
   取消
============================== */

function cancelArrival() {

  if (!selectedStudent) {
    return;
  }

  if (
    !confirm(
      selectedStudent.name +
      'さんの今日の登園記録を取り消しますか？'
    )
  ) {
    return;
  }

  jsonpRequest(
    {
      action: 'cancelAttendance',

      studentId:
        selectedStudent.studentId,

      type: 'arrival'
    },

    function(result) {

      alert(
        result &&
        result.message
          ? result.message
          : '処理が完了しました。'
      );

      loadTodayStatus();
      loadCurrentView();
    }
  );
}


function cancelDeparture() {

  if (!selectedStudent) {
    return;
  }

  if (
    !confirm(
      selectedStudent.name +
      'さんの今日の下校記録を取り消しますか？'
    )
  ) {
    return;
  }

  jsonpRequest(
    {
      action: 'cancelAttendance',

      studentId:
        selectedStudent.studentId,

      type: 'departure'
    },

    function(result) {

      alert(
        result &&
        result.message
          ? result.message
          : '処理が完了しました。'
      );

      loadTodayStatus();
      loadCurrentView();
    }
  );
}


/* ==============================
   通信
============================== */

function jsonpRequest(
  params,
  callback
) {

  const callbackName =
    'coral_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 99999
    );

  const script =
    document.createElement(
      'script'
    );

  let finished = false;


  function cleanup() {

    if (
      script.parentNode
    ) {
      script.parentNode.removeChild(
        script
      );
    }

    try {
      delete window[
        callbackName
      ];
    } catch (e) {}
  }


  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }

      finished = true;

      callback(result);

      cleanup();
    };


  const query =
    Object.keys(params)
      .map(
        function(key) {

          return (
            encodeURIComponent(
              key
            ) +
            '=' +
            encodeURIComponent(
              params[key]
            )
          );
        }
      )
      .join('&');


  script.src =
    GAS_URL +
    '?' +
    query +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&t=' +
    Date.now();


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      callback({
        success: false,
        message:
          '通信できませんでした。'
      });

      cleanup();
    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (finished) {
        return;
      }

      finished = true;

      callback({
        success: false,
        message:
          '通信に時間がかかっています。'
      });

      cleanup();

    },
    15000
  );
}


/* ==============================
   その他
============================== */

function showDetailLoading(show) {

  document
    .getElementById(
      'detailLoading'
    )
    .classList.toggle(
      'hidden',
      !show
    );
}


function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


window.addEventListener(
  'load',
  function() {

    startScanner();

    setMode('arrival');
  }
);
