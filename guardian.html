<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
コーラル学童 登園確認
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background: #f4f7fb;
  color: #222;
}

.container {
  max-width: 540px;
  margin: auto;
  padding: 18px;
}

.header {
  text-align: center;
  margin: 18px 0 20px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
}

.subtitle {
  color: #666;
  margin-top: 6px;
  font-size: 17px;
}

.loading {
  background: white;
  border-radius: 18px;
  padding: 30px 15px;
  text-align: center;
  box-shadow:
    0 4px 18px
    rgba(0,0,0,.08);
}

.childCard {
  background: white;
  border-radius: 20px;
  padding: 20px 16px;
  margin-bottom: 16px;
  box-shadow:
    0 4px 18px
    rgba(0,0,0,.08);
}

.name {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 6px;
}

.school {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 15px;
}

.statusBox {
  border-radius: 16px;
  padding: 22px 12px;
  text-align: center;
}

.arrived {
  background: #dcfce7;
  border: 3px solid #22c55e;
}

.notArrived {
  background: #f3f4f6;
  border: 3px solid #d1d5db;
}

.statusMain {
  font-size: 25px;
  font-weight: bold;
}

.statusTime {
  font-size: 20px;
  margin-top: 9px;
}

.reloadBtn {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  background: #2563eb;
  color: white;
  margin-top: 10px;
  cursor: pointer;
}

.update {
  text-align: center;
  color: #777;
  margin-top: 12px;
  font-size: 13px;
}

.notice {
  margin: 20px 0;
  text-align: center;
  color: #777;
  font-size: 13px;
  line-height: 1.6;
}

.error {
  background: #fee2e2;
  border: 2px solid #ef4444;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      コーラル学童クラブ
    </h1>

    <div class="subtitle">
      本日の登園確認
    </div>

  </div>


  <div
    id="loading"
    class="loading"
  >
    読み込み中...
  </div>


  <div
    id="content"
    style="display:none;"
  >

    <div id="children"></div>

    <button
      class="reloadBtn"
      onclick="loadStatus()"
    >
      最新の状態に更新
    </button>

    <div
      id="updateText"
      class="update"
    ></div>

  </div>


  <div class="notice">

    この画面は保護者専用です。<br>

    専用QRコードまたは
    専用URLからアクセスしてください。

  </div>

</div>


<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbxAMeNS1z_EnTgojm2KCGrhcimRXFr0XZD-FlhVGShh-AjCj3xTpyPYLaIAhx-wUKZo9g/exec';


function getKey() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get('key') || ''
  );
}


function loadStatus() {

  const key =
    getKey();

  const loading =
    document.getElementById(
      'loading'
    );

  const content =
    document.getElementById(
      'content'
    );

  const childrenBox =
    document.getElementById(
      'children'
    );


  loading.className =
    'loading';

  loading.innerText =
    '読み込み中...';

  loading.style.display =
    'block';

  content.style.display =
    'none';

  childrenBox.innerHTML =
    '';


  if (!key) {

    showError(
      '保護者用キーがありません。'
    );

    return;
  }


  jsonpRequest(
    {
      action:
        'guardianStatus',

      key:
        key
    },

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showError(
          result &&
          result.message
            ? result.message
            : '情報を取得できませんでした。'
        );

        return;
      }


      loading.style.display =
        'none';

      content.style.display =
        'block';


      let children =
        result.children || [];


      /*
        古い形式にも対応
      */
      if (
        children.length === 0 &&
        result.name
      ) {

        children = [{
          name:
            result.name,

          school:
            '',

          grade:
            '',

          arrived:
            result.arrived,

          arrivalTime:
            result.arrivalTime
        }];
      }


      children.forEach(
        function(child) {

          const card =
            document.createElement(
              'div'
            );

          card.className =
            'childCard';


          const statusClass =
            child.arrived
              ? 'arrived'
              : 'notArrived';


          const statusText =
            child.arrived
              ? '登園済みです'
              : 'まだ登園していません';


          const timeText =
            child.arrived &&
            child.arrivalTime

              ? (
                '登園時刻 ' +
                child.arrivalTime
              )

              : '';


          let schoolText = '';

          if (
            child.school ||
            child.grade
          ) {

            schoolText =
              '<div class="school">' +
              escapeHtml(
                child.school || ''
              ) +
              ' ' +
              escapeHtml(
                child.grade || ''
              ) +
              '</div>';
          }


          card.innerHTML =

            '<div class="name">' +

            escapeHtml(
              child.name ||
              '名前未登録'
            ) +

            '</div>' +

            schoolText +

            '<div class="statusBox ' +
            statusClass +
            '">' +

            '<div class="statusMain">' +
            statusText +
            '</div>' +

            '<div class="statusTime">' +

            escapeHtml(
              timeText
            ) +

            '</div>' +

            '</div>';


          childrenBox.appendChild(
            card
          );
        }
      );


      const now =
        new Date();


      document
        .getElementById(
          'updateText'
        )
        .innerText =

          '最終更新 ' +

          now.toLocaleTimeString(
            'ja-JP',
            {
              hour:
                '2-digit',

              minute:
                '2-digit'
            }
          );
    }
  );
}


function showError(message) {

  const loading =
    document.getElementById(
      'loading'
    );

  const content =
    document.getElementById(
      'content'
    );

  loading.innerText =
    message;

  loading.style.display =
    'block';

  loading.className =
    'loading error';

  content.style.display =
    'none';
}


function jsonpRequest(
  params,
  callback
) {

  const callbackName =

    'guardian_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() *
      99999
    );


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  function cleanup() {

    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );
    }


    try {

      delete window[
        callbackName
      ];

    } catch (e) {}
  }


  window[
    callbackName
  ] =
    function(result) {

      if (finished) {
        return;
      }

      finished =
        true;

      callback(
        result
      );

      cleanup();
    };


  const query =

    Object
      .keys(params)

      .map(
        function(key) {

          return (

            encodeURIComponent(
              key
            ) +

            '=' +

            encodeURIComponent(
              params[key]
            )
          );
        }
      )

      .join('&');


  script.src =

    GAS_URL +

    '?' +

    query +

    '&callback=' +

    encodeURIComponent(
      callbackName
    ) +

    '&t=' +

    Date.now();


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished =
        true;

      callback({
        success:
          false,

        message:
          '通信できませんでした。'
      });

      cleanup();
    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (finished) {
        return;
      }

      finished =
        true;

      callback({
        success:
          false,

        message:
          '通信に時間がかかっています。'
      });

      cleanup();

    },
    15000
  );
}


function escapeHtml(value) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}


window.addEventListener(
  'load',
  loadStatus
);

</script>

</body>

</html>
